version: 2

# Weekly version updates, grouped per ecosystem so each week opens at most a
# few PRs. Security updates are separate and not limited by this schedule.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    # release.yml is generated by cargo-dist; its pins live in
    # dist-workspace.toml [dist.github-action-commits] and are bumped by hand.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directories:
      - /
      - /editors/zed
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # Pinned dev tools for codegen tests and the VS Code extension.
  # tools/typescript-floor is omitted on purpose: it pins the TypeScript
  # 5.5.4 support floor, which must not move with releases.
  - package-ecosystem: npm
    directories:
      - /editors/vscode
      - /crates/suspect-codegen/tools/typescript-docs
      - /crates/suspect-codegen/tools/typescript-http-bundle
      - /crates/suspect-codegen/tools/yaml-oracle
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
