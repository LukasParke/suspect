# Publish job of the cargo-dist release (dist-workspace.toml,
# `publish-jobs`). release.yml calls it after the GitHub release exists and
# skips it for pre-release tags. Every job runs in the `release` environment
# (required reviewers) and does nothing but print a notice when its secret
# is not set, so a fork or a repository without publisher accounts still
# completes the release. docs/proposals/P5-release.md, "Editor packaging".
name: publish-editors

on:
  workflow_call:
    inputs:
      plan:
        description: dist-manifest.json from the plan job
        required: true
        type: string

permissions:
  contents: read

env:
  PLAN: ${{ inputs.plan }}

jobs:
  # Every .vsix built by package-editors, downloaded from the release and
  # checked against its .sha256, goes to the Marketplace and Open VSX: one
  # per VS Code target with the binary inside (TARGETS, the same list as
  # package-editors' vscode-platform matrix and
  # editors/vscode/scripts/package-target.cjs), plus the universal one that
  # serves every other platform (docs/proposals/P4-editors.md, step 9). Both
  # registries read the target from each VSIX's manifest. One job with a
  # loop rather than a matrix, so the `release` environment asks for one
  # approval, and the universal VSIX goes first.
  vscode:
    runs-on: ubuntu-22.04
    environment: release
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      TARGETS: darwin-arm64 darwin-x64 linux-x64 linux-arm64 alpine-x64 alpine-arm64 win32-x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Download the release .vsix files
        run: |
          set -euo pipefail
          TAG=$(jq -r '.announcement_tag' <<< "$PLAN")
          V="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir vsix
          list="suspect-vscode-$V.vsix"
          for target in $TARGETS; do list="$list suspect-vscode-$target-$V.vsix"; done
          for f in $list; do
            curl --proto '=https' --tlsv1.2 -fsSL -o "vsix/$f" "$base/$f"
            curl --proto '=https' --tlsv1.2 -fsSL -o "vsix/$f.sha256" "$base/$f.sha256"
            (cd vsix && sha256sum -c "$f.sha256")
          done
          echo "VSIX_LIST=$list" >> "$GITHUB_ENV"
          echo "VSIX_DIR=$PWD/vsix" >> "$GITHUB_ENV"
      # The pinned @vscode/vsce and ovsx from package-lock.json.
      - run: npm ci
        working-directory: editors/vscode
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          for f in $VSIX_LIST; do npx vsce publish --packagePath "$VSIX_DIR/$f"; done
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          for f in $VSIX_LIST; do npx ovsx publish "$VSIX_DIR/$f"; done
      - name: Skipped registries
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: |
          [ -n "$VSCE_PAT" ] || echo "::notice::VSCE_PAT is not set; the VS Code Marketplace was skipped"
          [ -n "$OVSX_PAT" ] || echo "::notice::OVSX_PAT is not set; Open VSX was skipped"

  # The zed-industries/extensions PR that moves the suspect submodule to the
  # release commit (.github/scripts/zed-registry-pr.sh). Runs only once the
  # first, manual submission is merged: set the repository variable
  # ZED_REGISTRY_FORK (owner/name of a fork of zed-industries/extensions)
  # and the ZED_EXTENSIONS_TOKEN secret.
  zed:
    runs-on: ubuntu-22.04
    environment: release
    env:
      GH_TOKEN: ${{ secrets.ZED_EXTENSIONS_TOKEN }}
      ZED_REGISTRY_FORK: ${{ vars.ZED_REGISTRY_FORK }}
    steps:
      # Full history: the script checks the tag commit is on main.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Open the registry PR
        if: env.GH_TOKEN != '' && env.ZED_REGISTRY_FORK != ''
        run: .github/scripts/zed-registry-pr.sh "$(jq -r '.announcement_tag' <<< "$PLAN")"
      - name: Skipped
        if: env.GH_TOKEN == '' || env.ZED_REGISTRY_FORK == ''
        run: echo "::notice::ZED_EXTENSIONS_TOKEN or ZED_REGISTRY_FORK is not set; the Zed registry PR was skipped"
