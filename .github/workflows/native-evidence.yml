name: native-evidence

# Continuous native evidence for the SDK backends.
#
# Each backend's acceptance suites are `#[ignore]`d because they need a
# native toolchain. This workflow installs one backend's toolchain per job,
# runs every ignored suite for that backend (`tests/<prefix>_*.rs` plus the
# in-crate `src/<module>` tests), and publishes the declared coverage matrix
# (`suspect evidence`) beside the test log.
#
# `SUSPECT_REQUIRE_NATIVE=1` turns a missing or broken toolchain into a
# failure instead of a skip, so a green job means the suites really ran.
# The OpenRouter-backed suites need the private openrouter-web repository at
# the pinned commit (toolchain::OPENROUTER_SPEC_COMMIT). Set the
# OPENROUTER_WEB_TOKEN secret (read access to OpenRouterTeam/openrouter-web)
# to check it out; without the secret those suites skip cleanly.
#
# This runs on a schedule and on demand. It does not gate pull requests;
# ci.yml is the blocking gate.

on:
  schedule:
    # 04:17 UTC daily — off the hour so the shared runner pool is calmer.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      backend:
        description: Run a single backend by name (empty runs all)
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SUSPECT_REQUIRE_NATIVE: "1"

jobs:
  # Builds the backend matrix, filtered to `inputs.backend` when set (a job
  # `if:` cannot read `matrix`, so the filter happens here).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          ONLY: ${{ inputs.backend }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          backends = [
              ("rust", "rust", "rust_"), ("go", "go", "go_"),
              ("typescript", "typescript", "typescript::"), ("python", "python", "python_"),
              ("csharp", "csharp", "csharp_sdk::"), ("java", "java", "java_sdk::"),
              ("kotlin", "kotlin", "kotlin_sdk::"), ("ruby", "ruby", "ruby_sdk::"),
              ("php", "php", "php_sdk::"), ("dart", "dart", "dart_sdk::"),
              ("cpp", "cpp", "cpp_sdk::"), ("swift", "swift", "swift_sdk::"),
              ("terraform", "terraform", "terraform::"),
              # Cross-backend suites (tests/groups/shared.rs): Go, Node,
              # Python, Swift and a headless Chrome; no in-crate module.
              ("shared", "shared", ""),
          ]
          only = os.environ.get("ONLY", "")
          include = [
              {"name": n, "prefix": p, "module": m}
              for n, p, m in backends
              if not only or only == n
          ]
          if not include:
              raise SystemExit(f"unknown backend {only!r}")
          print("matrix=" + json.dumps({"include": include}))
          PY

  backend:
    name: ${{ matrix.name }} native evidence
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OPENROUTER_WEB_TOKEN: ${{ secrets.OPENROUTER_WEB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to toolchain::OPENROUTER_SPEC_COMMIT; a codegen test keeps the
      # two in sync.
      - if: env.OPENROUTER_WEB_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: OpenRouterTeam/openrouter-web
          ref: 50b0c3910b36dc33c949a490bbe2fba59d574c42
          token: ${{ env.OPENROUTER_WEB_TOKEN }}
          path: openrouter-web
          persist-credentials: false
      - if: env.OPENROUTER_WEB_TOKEN != ''
        shell: bash
        run: echo "OPENROUTER_WEB_ROOT=$GITHUB_WORKSPACE/openrouter-web" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.name }}

      - if: matrix.name == 'go' || matrix.name == 'terraform' || matrix.name == 'shared'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # The TypeScript suites run Node 24 as a second runtime and pin the
      # package/doc toolchain to Node 22.23.1 exactly (tools/typescript-*
      # build scripts check the version). Install 24 first and record it, so
      # 22.23.1 is the one left on PATH.
      - if: matrix.name == 'typescript' || matrix.name == 'shared'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: matrix.name == 'typescript' || matrix.name == 'shared'
        run: echo "SUSPECT_NODE24_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - if: matrix.name == 'typescript' || matrix.name == 'shared'
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      # Generated Python packages are checked on the 3.11 floor and current
      # 3.14; installed-wheel suites create uv venvs per interpreter.
      - if: matrix.name == 'python' || matrix.name == 'go' || matrix.name == 'shared'
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.14
      - if: matrix.name == 'python' || matrix.name == 'go' || matrix.name == 'shared'
        uses: astral-sh/setup-uv@v6
      - if: matrix.name == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - if: matrix.name == 'java' || matrix.name == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - if: matrix.name == 'kotlin'
        # setup-java exports JAVA_HOME_<major>_X64 for each install; the
        # Kotlin suites exercise both supported JDKs.
        run: echo "SUSPECT_KOTLIN_JAVA_HOMES=$JAVA_HOME_21_X64:$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - if: matrix.name == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - if: matrix.name == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring, xml
      - if: matrix.name == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.9.4"
      - if: matrix.name == 'swift' || matrix.name == 'shared'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - if: matrix.name == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to tests/fixtures/terraform-v1/target.json terraform_version;
          # the address gate asserts the exact native parser revision.
          terraform_version: "1.15.8"
          terraform_wrapper: false
      # ubuntu-24.04 images ship Google Chrome; the browser gate drives it.
      - if: matrix.name == 'shared'
        run: echo "SUSPECT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Report the toolchain
        run: |
          {
            echo "backend: ${{ matrix.name }}"
            rustc --version
            case "${{ matrix.name }}" in
              go|terraform) go version ;;&
              terraform) terraform version | head -1 ;;
              typescript) node --version; npm --version ;;
              python) python3 --version ;;
              csharp) dotnet --list-sdks ;;
              java|kotlin) java -version 2>&1 | head -1; mvn --version | head -1 ;;
              ruby) ruby --version ;;
              php) php --version | head -1 ;;
              dart) dart --version 2>&1 | head -1 ;;
              cpp) c++ --version | head -1; cmake --version | head -1 ;;
              swift) swift --version 2>&1 | head -1 ;;
              shared) go version; node --version; python3 --version; swift --version 2>&1 | head -1; google-chrome --version ;;
            esac
          } | tee toolchain.txt

      # Per-suite packages under target/ (npm tool deps, the Python tools
      # venv, Ruby gems, PHP phars); a no-op for backends that need none.
      - name: Provision suite tools
        run: |
          if [ "${{ matrix.name }}" = shared ]; then
            tools/native-setup.sh typescript python
          else
            tools/native-setup.sh ${{ matrix.name }}
          fi

      # Each backend's suites are one grouped test binary
      # (crates/suspect-codegen/tests/groups/<prefix>.rs).
      - name: Run the backend's native suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p suspect-codegen --test ${{ matrix.prefix }} --no-fail-fast -- --ignored 2>&1 | tee native-tests.log
          if [ -n "${{ matrix.module }}" ]; then
            cargo test -p suspect-codegen --lib -- --ignored "${{ matrix.module }}" 2>&1 | tee -a native-tests.log
          fi

      - name: Publish the declared coverage matrix
        if: always()
        run: |
          cargo run -q -p suspect-cli -- evidence --format json > evidence.json
          {
            echo "# SDK evidence ${{ matrix.name }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo
            cat toolchain.txt
            echo
            cargo run -q -p suspect-cli -- evidence
          } > evidence.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-evidence-${{ matrix.name }}
          path: |
            evidence.json
            evidence.md
            toolchain.txt
            native-tests.log
