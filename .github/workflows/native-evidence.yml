name: native-evidence

# Continuous native evidence for the SDK backends.
#
# The per-backend acceptance suites are `#[ignore]`d because they need a
# native toolchain, so "is backend X actually verified right now?" is
# otherwise unknowable. This job answers it on a schedule without blocking
# a pull request: it installs each toolchain, runs that backend's suites,
# and publishes the declared coverage matrix (`suspect dev evidence`) beside
# the run results as an artifact.
#
# It is deliberately non-blocking for PRs. The blocking correctness gate is
# ci.yml; this is the dated evidence record.

on:
  schedule:
    # 04:17 UTC daily — off the hour so the shared runner pool is calmer.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      backend:
        description: Run a single backend (empty runs all)
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    name: ${{ matrix.name }} native evidence
    runs-on: ubuntu-latest
    # Never block a push or pull request on a scheduled evidence run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust
            toolchain: "stable"
            install: "rustup toolchain install stable --profile minimal"
            test_filter: "rust"
          - name: go
            toolchain: "go1.23"
            install: |
              curl -fsSL https://go.dev/dl/go1.23.4.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
              echo "/usr/local/go/bin" >> "$GITHUB_PATH"
            test_filter: "go"
          - name: node
            toolchain: "node22"
            install: |
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            test_filter: "typescript"
          - name: python
            toolchain: "python3.12"
            install: |
              sudo apt-get update
              sudo apt-get install -y python3.12 python3.12-venv
            test_filter: "python"
          - name: dotnet
            toolchain: "8.0"
            install: "dotnet-install.sh --channel 8.0 --install-dir $HOME/.dotnet"
            test_filter: "csharp"
          - name: jdk
            toolchain: "21"
            install: |
              sudo apt-get update
              sudo apt-get install -y openjdk-21-jdk maven
            test_filter: "java"
          - name: ruby
            toolchain: "3.3"
            install: |
              sudo apt-get update
              sudo apt-get install -y ruby-full
            test_filter: "ruby"
          - name: php
            toolchain: "8.3"
            install: |
              sudo apt-get update
              sudo apt-get install -y php8.3-cli php8.3-curl php8.3-xml
            test_filter: "php"
          - name: dart
            toolchain: "stable"
            install: |
              sudo apt-get update
              sudo apt-get install -y curl unzip
              curl -fsSL https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-linux-x64.zip -o /tmp/dart.zip
              sudo unzip /tmp/dart.zip -d /usr/lib
              echo "/usr/lib/dart-sdk/bin" >> "$GITHUB_PATH"
            test_filter: "dart"
          - name: swift
            toolchain: "6.0"
            install: |
              sudo apt-get update
              sudo apt-get install -y swiftlang
            test_filter: "swift"
          # Cross-backend suites (crates/suspect-codegen/tests/groups/shared.rs):
          # Go, Node, Python and a headless Chrome (preinstalled on the image).
          - name: shared
            toolchain: "go1.23+node22+python3.12"
            install: |
              curl -fsSL https://go.dev/dl/go1.23.4.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
              echo "/usr/local/go/bin" >> "$GITHUB_PATH"
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs python3.12 python3.12-venv
              echo "SUSPECT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            test_filter: "shared"
    env:
      OPENROUTER_WEB_TOKEN: ${{ secrets.OPENROUTER_WEB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The OpenRouter gates read OPENROUTER_WEB_ROOT, a private
      # openrouter-web checkout at toolchain::OPENROUTER_SPEC_COMMIT (a
      # codegen test keeps the two in sync). Needs the OPENROUTER_WEB_TOKEN
      # secret; without it those gates fail this (non-blocking) entry.
      - if: env.OPENROUTER_WEB_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: OpenRouterTeam/openrouter-web
          ref: 50b0c3910b36dc33c949a490bbe2fba59d574c42
          token: ${{ env.OPENROUTER_WEB_TOKEN }}
          path: openrouter-web
          persist-credentials: false
      - if: env.OPENROUTER_WEB_TOKEN != ''
        run: echo "OPENROUTER_WEB_ROOT=$GITHUB_WORKSPACE/openrouter-web" >> "$GITHUB_ENV"

      # Builds suspect with the version in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Build the toolchain
        run: ${{ matrix.install }}

      - name: Report the toolchain version
        run: |
          {
            echo "backend: ${{ matrix.name }}"
            echo "declared: ${{ matrix.toolchain }}"
            case "${{ matrix.name }}" in
              go) go version ;;
              node) node --version ;;
              python) python3 --version ;;
              dotnet) dotnet --version ;;
              jdk) java -version 2>&1 | head -1 ;;
              ruby) ruby --version ;;
              php) php --version | head -1 ;;
              dart) dart --version 2>&1 | head -1 ;;
              swift) swift --version ;;
              *) rustc --version ;;
            esac
          } | tee toolchain.txt

      # Per-suite packages under target/ (npm tool deps, the Python tools
      # venv, Ruby gems, PHP phars); a no-op for backends that need none.
      - name: Provision suite tools
        run: |
          case "${{ matrix.name }}" in
            node) tools/native-setup.sh typescript ;;
            shared) tools/native-setup.sh typescript python ;;
            *) tools/native-setup.sh ${{ matrix.name }} ;;
          esac

      - name: Build suspect
        run: cargo build --release -p suspect-cli

      - name: Run the backend's acceptance suites
        run: |
          # `--ignored` runs the opt-in native suites. Each backend's suites
          # are one grouped test binary
          # (`crates/suspect-codegen/tests/groups/<name>.rs`). A failure fails
          # this matrix entry; the job's `continue-on-error` keeps it from
          # blocking anything else.
          cargo test -p suspect-codegen --release \
            --test "${{ matrix.test_filter }}" \
            -- --ignored --nocapture

      - name: Publish the declared coverage matrix
        run: |
          ./target/release/suspect dev evidence --format json > evidence.json
          {
            echo "# SDK evidence ${{ matrix.name }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo
            cat toolchain.txt
            echo
            ./target/release/suspect dev evidence
          } > evidence.md

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-evidence-${{ matrix.name }}
          path: |
            evidence.json
            evidence.md
            toolchain.txt
