# Global artifacts job of the cargo-dist release (dist-workspace.toml,
# `global-artifacts-jobs`). release.yml calls it after the binaries are built;
# everything uploaded as `artifacts-*` is attached to the GitHub release.
# docs/proposals/P5-release.md, "Editor packaging" and "Testing".
name: package-editors

on:
  workflow_call:
    inputs:
      plan:
        description: dist-manifest.json from the plan job
        required: true
        type: string

permissions:
  contents: read

env:
  PLAN: ${{ inputs.plan }}

jobs:
  # The universal .vsix (no binary inside) and its checksum.
  vscode:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Version from the plan
        run: |
          TAG=$(jq -r '.announcement_tag' <<< "$PLAN")
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Every version line matches the tag
        run: cargo xtask check-versions --tag "$TAG"
      - name: Build and test
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npm run test:headless
      # `vscode:prepublish` bundles dist/extension.js with esbuild, so the
      # VSIX carries no node_modules (`--no-dependencies`).
      - name: Package
        working-directory: editors/vscode
        run: |
          npx vsce package --no-dependencies --out "suspect-vscode-${VERSION}.vsix"
          sha256sum "suspect-vscode-${VERSION}.vsix" > "suspect-vscode-${VERSION}.vsix.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-package-editors
          path: |
            editors/vscode/suspect-vscode-*.vsix
            editors/vscode/suspect-vscode-*.vsix.sha256

  # One VSIX per VS Code target with the matching release binary at
  # bin/suspect (docs/proposals/P4-editors.md, "Binary acquisition"). The
  # Marketplace and Open VSX serve each platform its own; the universal one
  # above covers every other platform, which then uses `suspect` on PATH.
  # scripts/package-target.cjs holds the same target -> triple table.
  vscode-platform:
    needs: vscode
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, triple: aarch64-apple-darwin, ext: tar.gz }
          - { target: darwin-x64, triple: x86_64-apple-darwin, ext: tar.gz }
          - { target: linux-x64, triple: x86_64-unknown-linux-musl, ext: tar.gz }
          - { target: linux-arm64, triple: aarch64-unknown-linux-musl, ext: tar.gz }
          - { target: alpine-x64, triple: x86_64-unknown-linux-musl, ext: tar.gz }
          - { target: alpine-arm64, triple: aarch64-unknown-linux-musl, ext: tar.gz }
          - { target: win32-x64, triple: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: dist
          merge-multiple: true
      - name: Verify and extract the binary
        env:
          ASSET: suspect-cli-${{ matrix.triple }}.${{ matrix.ext }}
        run: |
          set -euo pipefail
          want=$(awk '{print $1; exit}' "dist/$ASSET.sha256")
          got=$(sha256sum "dist/$ASSET" | awk '{print $1}')
          [ "$want" = "$got" ] || { echo "checksum mismatch: $want != $got" >&2; exit 1; }
          mkdir unpacked
          case "$ASSET" in
            *.zip) unzip -q "dist/$ASSET" -d unpacked ;;
            *) tar -xzf "dist/$ASSET" -C unpacked ;;
          esac
          bin=$(find unpacked -maxdepth 2 -type f \( -name suspect -o -name suspect.exe \) | head -n1)
          [ -n "$bin" ] || { echo "no suspect binary at depth 1 or 2" >&2; find unpacked >&2; exit 1; }
          echo "BINARY=$PWD/$bin" >> "$GITHUB_ENV"
      - name: Package
        working-directory: editors/vscode
        env:
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          npm ci
          vsix="suspect-vscode-${TARGET}-${VERSION}.vsix"
          node scripts/package-target.cjs --target "$TARGET" --binary "$BINARY" --out "$vsix"
          sha256sum "$vsix" > "$vsix.sha256"
          # The packaged binary is the one from the archive, and runs here
          # when the target matches the runner.
          unzip -q "$vsix" -d check
          ls -l check/extension/bin
          if [ "$TARGET" = linux-x64 ]; then
            check/extension/bin/suspect --version | grep -qx "suspect $VERSION"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-package-editors-${{ matrix.target }}
          path: |
            editors/vscode/suspect-vscode-${{ matrix.target }}-*.vsix
            editors/vscode/suspect-vscode-${{ matrix.target }}-*.vsix.sha256

  # Install the .vsix into a headless VS Code: the manifest the Marketplace
  # will see must load.
  vscode-install:
    needs: vscode
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-package-editors
      - name: code --install-extension
        run: |
          sudo snap install code --classic
          sha256sum -c suspect-vscode-*.vsix.sha256
          dir=$(mktemp -d)
          code --extensions-dir "$dir/ext" --user-data-dir "$dir/data" --install-extension suspect-vscode-*.vsix
          code --extensions-dir "$dir/ext" --user-data-dir "$dir/data" --list-extensions --show-versions | tee installed.txt
          grep -qx "suspect.suspect-vscode@${PLAN_VERSION}" installed.txt
        env:
          PLAN_VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}

  # Each archive a client downloads works on a clean runner: checksum,
  # binary at depth 1 or 2, `suspect --version`, and `suspect check` on the
  # demo spec exiting 0 or 1. Linux uses the static musl build, as editors do.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-musl
            ext: tar.gz
          - runner: macos-14
            triple: aarch64-apple-darwin
            ext: tar.gz
          - runner: windows-2022
            triple: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: dist
          merge-multiple: true
      - name: Verify, extract, run
        env:
          ASSET: suspect-cli-${{ matrix.triple }}.${{ matrix.ext }}
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
        run: |
          set -euo pipefail
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          want=$(awk '{print $1; exit}' "dist/$ASSET.sha256")
          got=$(sha "dist/$ASSET" | awk '{print $1}')
          [ "$want" = "$got" ] || { echo "checksum mismatch: $want != $got" >&2; exit 1; }
          mkdir unpacked
          # Git Bash's tar cannot read zip; the Windows runners ship 7-Zip.
          case "$ASSET" in
            *.zip) 7z x -y -ounpacked "dist/$ASSET" >/dev/null ;;
            *) tar -xzf "dist/$ASSET" -C unpacked ;;
          esac
          bin=$(find unpacked -maxdepth 2 -type f \( -name suspect -o -name suspect.exe \) | head -n1)
          [ -n "$bin" ] || { echo "no suspect binary at depth 1 or 2" >&2; find unpacked >&2; exit 1; }
          "$bin" --version | tee version.txt
          grep -qx "suspect $VERSION" version.txt
          rc=0
          "$bin" check docs/demo/petstore.yaml || rc=$?
          echo "suspect check exited $rc"
          [ "$rc" -le 1 ]

  # Every name in the asset contract exists (P5 "Asset contract"). The
  # installers, formula and source tarball come from dist's global job.
  asset-names:
    needs: [vscode, vscode-platform]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true
      - name: Compare
        env:
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
        run: |
          set -euo pipefail
          missing=0
          for triple in aarch64-apple-darwin x86_64-apple-darwin \
              x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
              x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            for f in "suspect-cli-$triple.tar.gz" "suspect-cli-$triple.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "missing $f"; missing=1; }
            done
          done
          for f in suspect-cli-x86_64-pc-windows-msvc.zip suspect-cli-x86_64-pc-windows-msvc.zip.sha256 \
              "suspect-vscode-$VERSION.vsix" "suspect-vscode-$VERSION.vsix.sha256"; do
            [ -f "dist/$f" ] || { echo "missing $f"; missing=1; }
          done
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 alpine-x64 alpine-arm64 win32-x64; do
            for f in "suspect-vscode-$target-$VERSION.vsix" "suspect-vscode-$target-$VERSION.vsix.sha256"; do
              [ -f "dist/$f" ] || { echo "missing $f"; missing=1; }
            done
          done
          ls dist
          exit "$missing"
