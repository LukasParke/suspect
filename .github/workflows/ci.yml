name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets
  # Mirrors the docs.yml build so broken or private intra-doc links fail the
  # PR instead of the post-merge Pages deploy.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - run: cargo doc --workspace --no-deps
  # Advisories, licenses, bans and sources per the root deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace
          manifest-path: ./Cargo.toml
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The suspect-rules worker tests return early without Bun; install it
      # so they run here instead of passing vacuously.
      - uses: oven-sh/setup-bun@v2
      - run: cargo test --workspace
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo bench --workspace -- --test
  corpus-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -p xtask -- fetch-corpus
      - run: cargo test -p suspect-cli --test corpus_suite
