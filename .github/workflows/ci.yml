name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Every job is `cargo xtask ci <job id> --ci` (xtask/src/ci.rs); the steps
# before it only install tools. Run the same job locally with
# `cargo xtask ci <job id>`. A test keeps this file and the job table in sync.
# The toolchain version is the one in rust-toolchain.toml.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo xtask ci fmt --ci
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci clippy --ci
  # Mirrors the docs.yml build so broken or private intra-doc links fail the
  # PR instead of the post-merge Pages deploy.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci docs --ci
  # Advisories, licenses, bans and sources per the root deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci cargo-deny --ci
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      # The suspect-rules worker tests need Bun; with --ci the job sets
      # SUSPECT_REQUIRE_TOOLS=bun,node,python so a missing one fails.
      - uses: oven-sh/setup-bun@v2
      - run: cargo xtask ci test --ci
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci bench-smoke --ci
  corpus-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci corpus-validation --ci
  # Relative links in every tracked Markdown file, offline (lychee.toml).
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.24.2
      - run: cargo xtask ci links --ci
  # The seven foundation crates must stay publishable (docs/proposals/P5-release.md).
  # Every other crate is `publish = false`.
  package-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci package-foundation --ci
  # One lockstep version across crates, lockfiles, editors and the rules SDK.
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci check-versions --ci
  # release.yml is generated by cargo-dist from dist-workspace.toml; edit the
  # config and run `dist generate`, never the workflow. The version matches
  # cargo-dist-version there (dist refuses to run with another).
  dist-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@0.32.0
      - run: cargo xtask ci dist-check --ci
  # Non-Linux coverage for the binary and the load path (P5 step 3). The
  # Windows job is informational until its first green run, then
  # `continue-on-error` goes (docs/proposals/P5-release.md, Windows tier 2).
  # Line endings stay LF on Windows through .gitattributes.
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci test-macos --ci
  test-windows:
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci test-windows --ci
