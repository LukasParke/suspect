name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets
      # The language server's live-run feature gates the workflow runner;
      # the build without it must stay warning-free too.
      - run: cargo clippy -p suspect-lsp --no-default-features --all-targets
      # Every language SDK backend is an opt-in feature over the shared
      # protocol plan; the build with none of them must stay warning-free.
      - run: cargo clippy -p suspect-codegen --no-default-features --all-targets
  # The declared `rust-version` (workspace Cargo.toml) must actually build.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets
  # Workflow files are code too: expression, context and shell mistakes
  # otherwise only surface when a scheduled run silently misbehaves.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
  # Advisories, licenses, bans and sources per deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  # Mirrors the docs.yml build so broken or private intra-doc links fail the
  # PR instead of the post-merge Pages deploy.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - run: cargo doc --workspace --no-deps
  # Generated artifacts and manifests must be portable (forward-slash
  # manifest paths, no Windows device-name files), so the suite runs on
  # every host OS a generator user may run it from.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo bench --workspace -- --test
  corpus-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -p xtask -- fetch-corpus
      - run: cargo test -p suspect-cli --test corpus_suite
  # Line coverage of the default test suite, published as an lcov artifact.
  coverage:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
