name: application-targets

# Application targets: the Go/Cobra API CLI (`suspect gen cli`) and the
# TypeScript stdio MCP server (`suspect gen mcp`). Four explicit jobs run
# the portable application suites only — never the whole workspace and never
# all corpus-dependent ignored tests. The two native jobs build and drive real
# emitted artifacts against loopback HTTP fixtures; no upstream API is
# contacted. See docs/guide/application-targets.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust planning, admission, refusal and deterministic-emission coverage for
  # the shared application contract and both generators. Needs no native
  # toolchain, so it is the gate that must never be environment-dependent.
  planning:
    name: Rust planning and emission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
          shared-key: application-targets

      - name: Application planning tests
        run: >-
          cargo test -p suspect-codegen --test shared --
          application:: api_cli:: mcp::

  # Portable native acceptance for the Go CLI: build the emitted module with
  # the real Go toolchain under the default -mod=readonly, run its own tests,
  # then drive the built executable against the python3 loopback fixture.
  native-go-cli:
    name: Native Go CLI acceptance
    # Pinned to the image the exact python below has a build for;
    # `ubuntu-latest` moved to 26.04, where 3.12.12 is not published.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
          shared-key: application-targets

      # The emitted module carries an explicit `toolchain` directive; a stable
      # release satisfies it without the toolchain downloading a replacement.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # The loopback HTTP fixtures are the exactness oracle for both native
      # suites, so python is pinned exactly, as in sdk-session-performance.yml.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.12"

      - name: Report native toolchain versions
        run: |
          go version
          python3 --version

      - name: Go CLI generation and native acceptance
        run: >-
          cargo test -p suspect-codegen
          --test shared api_cli:: -- --include-ignored

  # Portable native acceptance for the MCP server: install the emitted
  # lockfile, compile with the pinned TypeScript, then drive the built stdio
  # server with the matching official MCP client against the python3 loopback
  # fixture. This job needs npm registry access.
  #
  # The matrix low end is the emitted application's runtime floor, Node 22,
  # which is also what its emitted `engines.node` declares. The app depends on
  # the official MCP SDK (own minimum 20) and embeds the canonical Suspect
  # TypeScript SDK as compiled-in source (`engines.node: ">=22"`, see
  # crates/suspect-codegen/src/typescript/package.rs), so the real floor is the
  # stricter of the two; `mcp::NODE_MINIMUM_MAJOR` derives it from that SDK
  # constant rather than restating it. The high end is the current release the
  # suite was last witnessed on locally, so the declared floor and a modern
  # runtime are both really built and run here.
  native-mcp-server:
    name: Native MCP server acceptance (Node ${{ matrix.node }})
    # Same image pin as native-go-cli, for the same python build.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
          shared-key: application-targets

      # npm arrives with the Node distribution.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.12"

      - name: Report native toolchain versions
        run: |
          node --version
          npm --version
          python3 --version

      - name: MCP generation and native acceptance
        run: >-
          cargo test -p suspect-codegen
          --test shared mcp:: -- --include-ignored

  # `suspect gen cli` / `suspect gen mcp`: argument handling, report
  # formats, check/current/drift, input failures, ownership conflicts and
  # application profile discovery.
  commands:
    name: Suspect command integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
          shared-key: application-targets

      - name: Application command tests
        run: cargo test -p suspect-cli --test application_codegen
