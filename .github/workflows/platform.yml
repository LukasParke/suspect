name: platform

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# fmt / clippy / cargo test for the workspace run in ci.yml; this workflow
# covers the end-to-end smoke plus the editor clients and the rules runtime.
# Every job is `cargo xtask ci <job id> --ci` (xtask/src/ci.rs); the steps
# before it only install tools. The toolchain version is the one in
# rust-toolchain.toml.
jobs:
  # Gateway mock + Arazzo suite, live and then offline against a cassette.
  platform-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci platform-smoke --ci

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # Builds the debug CLI, then npm ci, compile, the headless tests and the
      # CLI-backed generation tests. The real-host gate
      # (test:generation:host) needs pinned VS Code/Playwright inputs and
      # runs in its own workflow.
      - run: cargo xtask ci vscode-extension --ci

  zed-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          # The WASI target Zed loads extensions from.
          targets: wasm32-wasip1
      # The extension crate is outside the repository workspace; it carries
      # its own [workspace] table and lockfile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            editors/zed
      - run: cargo xtask ci zed-extension --ci

  rules-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo xtask ci rules-runtime --ci
