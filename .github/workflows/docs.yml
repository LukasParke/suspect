name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # missing_docs is enforced in source via #![deny(missing_docs)];
      # RUSTDOCFLAGS=-D warnings additionally fails on broken intra-doc links.
      - run: cargo doc --workspace --no-deps
      - name: Write landing-page redirect
        run: |
          cat > target/doc/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>suspect — OpenAPI/Arazzo/Overlay toolkit for Rust</title>
            <meta http-equiv="refresh" content="0; url=suspect_cli/">
            <link rel="canonical" href="suspect_cli/">
          </head>
          <body>
            <p>Redirecting to the <a href="suspect_cli/">suspect CLI documentation</a>…</p>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
