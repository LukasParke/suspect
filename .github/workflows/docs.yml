name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
      # missing_docs is enforced in source via #![deny(missing_docs)];
      # RUSTDOCFLAGS=-D warnings additionally fails on broken intra-doc links.
      - run: cargo doc --workspace --no-deps
      - name: Write landing-page redirect
        run: |
          cat > target/doc/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>suspect — OpenAPI/Arazzo/Overlay toolkit for Rust</title>
            <meta http-equiv="refresh" content="0; url=suspect_cli/">
            <link rel="canonical" href="suspect_cli/">
          </head>
          <body>
            <p>Redirecting to the <a href="suspect_cli/">suspect CLI documentation</a>…</p>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
