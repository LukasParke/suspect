name: 'suspect'
description: >
  Build the suspect CLI in release mode and run one of its subcommands
  (check | test | gen) with sensible defaults.
inputs:
  command:
    description: 'Subcommand to run: check | test | gen.'
    required: true
  paths:
    description: 'check: documents to check (space/newline separated).'
    required: false
    default: ''
  arazzo:
    description: 'test: path to the Arazzo suite document.'
    required: false
    default: ''
  base-url:
    description: 'test: base URL prepended to operation paths.'
    required: false
    default: 'http://127.0.0.1:8080'
  cassette:
    description: 'test: record a Suspect Cassette to replay offline (implies --offline).'
    required: false
    default: ''
  report:
    description: 'test: event stream format: text | ndjson.'
    required: false
    default: 'text'
  filter:
    description: 'test: only run workflows whose id contains this substring.'
    required: false
    default: ''
  preset:
    description: 'gen: shipped documentation preset (docs-md).'
    required: false
    default: ''
  manifest:
    description: 'gen: custom gen.toml manifest (conflicts with preset).'
    required: false
    default: ''
  out-dir:
    description: 'gen: output root directory.'
    required: false
    default: 'gen-out'
  diff:
    description: 'gen: print unified diffs without writing files.'
    required: false
    default: 'true'
  extra-args:
    description: 'Additional raw arguments appended to the chosen subcommand.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .

    - name: Build suspect CLI (release)
      shell: bash
      run: cargo build --release -p suspect-cli

    - name: Run suspect ${{ inputs.command }}
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_ARAZZO: ${{ inputs.arazzo }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_CASSETTE: ${{ inputs.cassette }}
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_FILTER: ${{ inputs.filter }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_OUT_DIR: ${{ inputs.out-dir }}
        INPUT_DIFF: ${{ inputs.diff }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        BIN="./target/release/suspect"
        EXTRA=()
        if [ -n "$INPUT_EXTRA_ARGS" ]; then read -r -a EXTRA <<< "$INPUT_EXTRA_ARGS"; fi

        case "$INPUT_COMMAND" in
          check)
            if [ -z "$INPUT_PATHS" ]; then
              echo "input `paths` is required for the check command" >&2
              exit 2
            fi
            DOCS=$(echo "$INPUT_PATHS" | tr '\n' ' ')
            # shellcheck disable=SC2086
            "$BIN" check $DOCS --format json "${EXTRA[@]}"
            ;;
          test)
            if [ -z "$INPUT_ARAZZO" ]; then
              echo "input `arazzo` is required for the test command" >&2
              exit 2
            fi
            ARGS=(test "$INPUT_ARAZZO" --base-url "$INPUT_BASE_URL" --report "$INPUT_REPORT")
            if [ -n "$INPUT_FILTER" ]; then ARGS+=(--filter "$INPUT_FILTER"); fi
            if [ -n "$INPUT_CASSETTE" ]; then ARGS+=(--offline --cassette "$INPUT_CASSETTE"); fi
            "$BIN" "${ARGS[@]}" "${EXTRA[@]}"
            ;;
          gen)
            if [ -z "$INPUT_PRESET" ] && [ -z "$INPUT_MANIFEST" ]; then
              echo "one of inputs `preset` or `manifest` is required for the gen command" >&2
              exit 2
            fi
            ARGS=(gen)
            if [ -n "$INPUT_PRESET" ]; then ARGS+=(--preset "$INPUT_PRESET");
            else ARGS+=(--manifest "$INPUT_MANIFEST"); fi
            ARGS+=("--out" "$INPUT_OUT_DIR")
            if [ "$INPUT_DIFF" = "true" ]; then ARGS+=(--diff); fi
            "$BIN" "${ARGS[@]}" "${EXTRA[@]}"
            ;;
          *)
            echo "unknown command '$INPUT_COMMAND' (expected check | test | gen)" >&2
            exit 2
            ;;
        esac
