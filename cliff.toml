# git-cliff configuration for CHANGELOG.md (docs/proposals/P5-release.md).
# `cargo xtask bump <version>` runs
#   git cliff --unreleased --tag v<version> --prepend CHANGELOG.md
# and dist uses the matching section as the GitHub release body.

[changelog]
# `--prepend` strips this header from the existing file and writes it again
# above the new section, so it must stay byte-identical to CHANGELOG.md's.
header = """
# Changelog

All notable changes to suspect are listed here. Versions follow the policy in
CONTRIBUTING.md ("Releasing"): before 1.0, a release that removes or renames a
command, flag, config key or exit code bumps the minor version.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}

"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
# The <!-- n --> prefixes order the groups; `striptags` removes them.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(chore\\(deps|chore: bump)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^(chore|ci|test|style|refactor|build)", skip = true },
  # Pre-convention milestone subjects (`lsp: ...`, `platform: ...`).
  { message = ".*", group = "<!-- 4 -->Other" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
