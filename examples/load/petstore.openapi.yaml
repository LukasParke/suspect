openapi: 3.1.0
info:
  title: Petstore (load example)
  version: "1.0"
servers:
  - url: http://localhost:8080
paths:
  /login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: session token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: page of pets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PetPage" }
    post:
      operationId: createPet
      parameters:
        - name: Authorization
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
  /pets/{petId}:
    get:
      operationId: showPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: one pet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
    delete:
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: gone
components:
  schemas:
    Session:
      type: object
      required: [token]
      properties:
        token:
          type: string
          example: tok_demo_123
    PetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Pet" }
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string }
        tag: { type: string }
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: "pet_42"
        name:
          type: string
          example: Rex
        tag:
          type: string
          example: happy
