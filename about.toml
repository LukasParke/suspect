# cargo-about configuration for THIRD-PARTY-NOTICES.md, which ships in every
# release archive. Regenerate after a dependency change:
#   cargo about generate --locked -m crates/suspect-cli/Cargo.toml -o THIRD-PARTY-NOTICES.md about.hbs
# The accepted set is deny.toml's [licenses] allow list.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]
# The release targets (dist-workspace.toml); platform-only crates such as
# windows-sys are listed once for all of them.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Internal workspace crates are covered by LICENSE-MIT / LICENSE-APACHE.
private = { ignore = true }
