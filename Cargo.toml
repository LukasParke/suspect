[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Luke"]

[workspace.dependencies]
# internal crates
suspect-source = { path = "crates/suspect-source", version = "0.1.0" }
suspect-syntax = { path = "crates/suspect-syntax", version = "0.1.0" }
suspect-low = { path = "crates/suspect-low", version = "0.1.0" }
suspect-ref = { path = "crates/suspect-ref", version = "0.1.0" }
suspect-jsonpath = { path = "crates/suspect-jsonpath", version = "0.1.0" }
suspect-schema = { path = "crates/suspect-schema", version = "0.1.0" }
suspect-oas = { path = "crates/suspect-oas", version = "0.1.0" }
suspect-arazzo = { path = "crates/suspect-arazzo", version = "0.1.0" }
suspect-overlay = { path = "crates/suspect-overlay", version = "0.1.0" }
suspect-validate = { path = "crates/suspect-validate", version = "0.1.0" }
suspect-lint = { path = "crates/suspect-lint", version = "0.1.0" }
suspect-lsp = { path = "crates/suspect-lsp", version = "0.1.0" }
suspect-ir = { path = "crates/suspect-ir", version = "0.1.0" }
suspect-journal = { path = "crates/suspect-journal", version = "0.1.0" }
suspect-reverse = { path = "crates/suspect-reverse", version = "0.1.0" }
suspect-rules = { path = "crates/suspect-rules", version = "0.1.0" }
suspect-rex = { path = "crates/suspect-rex", version = "0.1.0" }
suspect-test = { path = "crates/suspect-test", version = "0.1.0" }
suspect-gen = { path = "crates/suspect-gen", version = "0.1.0" }
suspect-codegen = { path = "crates/suspect-codegen", version = "0.1.0" }
suspect-gateway = { path = "crates/suspect-gateway", version = "0.1.0" }
suspect-watch = { path = "crates/suspect-watch", version = "0.1.0" }

# external
tree-sitter = "0.26"
memmap2 = "0.9"
rayon = "1.12"
rustc-hash = "2"
dashmap = "6"
smallvec = "1"
thiserror = "2"
url = "2"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
tower-lsp = "0.20"
async-trait = "0.1"
bytes = "1"
criterion = "0.8"
proptest = "1"
tempfile = "3"
anyhow = "1"
ureq = "3"
cc = "1"
memchr = "2"
tree-sitter-language = "0.1"
notify = "8"

[profile.dev]
# Concurrent cargo sessions from sibling worktrees race on incremental
# dep-graph files; disabling avoids spurious ENOSPC failures.
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

# keep test/dev builds usable for perf sanity checks
[profile.dev.package."*"]
opt-level = 1
