[package]
name = "suspect-codegen"
description = "Canonical OpenAPI SDK compiler with native multi-language backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Integration tests are grouped one binary per backend (tests/groups/).
autotests = false

[features]
default = ["ruby-sdk", "csharp-sdk", "java-sdk", "kotlin-sdk", "php-sdk", "dart-sdk", "cpp-sdk"]
# Language modules become default after native acceptance.
java-sdk = []
csharp-sdk = []
kotlin-sdk = []
ruby-sdk = []
php-sdk = []
dart-sdk = []
cpp-sdk = []

[dependencies]
suspect-artifact.workspace = true
suspect-ir.workspace = true
suspect-gen.workspace = true
suspect-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
pep440_rs = "=0.7.3"
url.workspace = true
suspect-ref.workspace = true
suspect-source.workspace = true
sha2 = "0.10.9"
regex.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true
sha2 = "0.10.9"
tempfile.workspace = true
suspect-low.workspace = true
suspect-overlay.workspace = true
suspect-ref.workspace = true
suspect-source.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.189"

[[test]]
name = "cpp"
path = "tests/groups/cpp.rs"
required-features = ["cpp-sdk"]

[[test]]
name = "csharp"
path = "tests/groups/csharp.rs"
required-features = ["csharp-sdk"]

[[test]]
name = "dart"
path = "tests/groups/dart.rs"
required-features = ["dart-sdk"]

[[test]]
name = "go"
path = "tests/groups/go.rs"

[[test]]
name = "java"
path = "tests/groups/java.rs"
required-features = ["java-sdk"]

[[test]]
name = "kotlin"
path = "tests/groups/kotlin.rs"
required-features = ["kotlin-sdk"]

[[test]]
name = "php"
path = "tests/groups/php.rs"
required-features = ["php-sdk"]

[[test]]
name = "python"
path = "tests/groups/python.rs"

[[test]]
name = "ruby"
path = "tests/groups/ruby.rs"
required-features = ["ruby-sdk"]

[[test]]
name = "rust"
path = "tests/groups/rust.rs"

[[test]]
name = "shared"
path = "tests/groups/shared.rs"

[[test]]
name = "swift"
path = "tests/groups/swift.rs"

[[test]]
name = "terraform"
path = "tests/groups/terraform.rs"

[[test]]
name = "typescript"
path = "tests/groups/typescript.rs"

# Includes the generated Rust JSON runtime verbatim, which addresses its
# sibling types as `crate::…`, so it must be its own crate root.
[[test]]
name = "rust_codecs_json"
path = "tests/rust_codecs_json.rs"
