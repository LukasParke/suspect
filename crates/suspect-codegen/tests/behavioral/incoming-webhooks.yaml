# INVARIANT: a 3.1 `webhooks` entry compiles into a typed incoming
# payload decoder and constructor in every backend that claims
# `incoming-webhooks` — consumer-side handler types distinct from the
# outgoing operation surface, with the declared receipt route carried
# through.
# INVARIANT: webhook decoding is core emission for an admitted webhook
# definition, not SDK-defaults-gated; the fragment declares
# `x-suspect-gated: false`.
x-suspect-feature: incoming-webhooks
x-suspect-gated: false
openapi: 3.1.0
info: {title: behavioral fragments, version: '1'}
servers:
  - url: https://api.hooks.test/v1
paths:
  /orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: Every order.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
webhooks:
  orderCreated:
    post:
      operationId: onOrderCreated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: {type: string}
                total: {type: number}
              required: [orderId, total]
      responses:
        '200':
          description: Acknowledged.
  orderCancelled:
    post:
      operationId: onOrderCancelled
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: {type: string}
                reason: {type: string}
              required: [orderId]
      responses:
        '200':
          description: Acknowledged.
