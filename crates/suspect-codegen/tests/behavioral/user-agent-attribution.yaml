# INVARIANT: every generated SDK identifies itself on the wire with the
# ua/v1 attribution grammar — the package descriptor (suspect version,
# spec version, sdk name, language) and a user-agent resolution runtime —
# in every backend that claims the `user-agent-attribution` feature.
# INVARIANT: attribution is core emission, not SDK-defaults-gated; the
# fragment declares `x-suspect-gated: false`.
x-suspect-feature: user-agent-attribution
x-suspect-gated: false
openapi: 3.1.0
info: {title: behavioral fragments, version: '1'}
servers:
  - url: https://api.attribution.test/v1
paths:
  /widgets:
    get:
      operationId: listWidgets
      responses:
        '200':
          description: Every widget.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
x-suspect-behavior:
  python:
    file: python/src/pagination_sdk/_client.py
    markers:
      - '_ATTRIBUTION = {'
      - "'suspect_version':"
  rust:
    file: rust/src/attribution.rs
    markers:
      - 'ATTRIBUTION_SUSPECT_VERSION'
  typescript:
    file: typescript/runtime.ts
    markers:
      - 'resolveUserAgent'
      - 'applicationId'
  cpp:
    file: cpp/include/pagination_cpp/attribution.hpp
    markers:
      - 'attribution_sdk_name'
      - 'attribution_language'
  csharp:
    file: csharp/src/Attribution.g.cs
    markers:
      - 'internal static class Attribution'
  dart:
    file: dart/lib/src/attribution.dart
    markers:
      - 'userAgentSdkName'
      - 'userAgentSdkVersion'
  java:
    file: java/src/main/java/test/suspect/Attribution.java
    markers:
      - 'public final class Attribution'
  kotlin:
    file: kotlin/src/main/kotlin/test/suspect/pagination_kotlin/Attribution.kt
    markers:
      - 'ATTRIBUTION_SPEC_VERSION'
  php:
    file: php/src/Http.php
    markers:
      - 'userAgent'
  ruby:
    file: ruby/lib/pagination_sdk/attribution.rb
    markers:
      - 'ATTRIBUTION = {'
  swift:
    file: swift/Sources/PaginationSDK/Attribution.swift
    markers:
      - 'enum Attribution'
