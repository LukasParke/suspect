# INVARIANT: security schemes resolve credentials from the documented
# environment variables at client construction in every backend that claims
# `env-var-credentials` — the compiled variable name is read from the
# process environment into the credential type rather than passed by the
# caller.
# INVARIANT: environment-credential resolution is SDK-defaults-gated: the
# fragment declares `x-suspect-gated: true` and configures the service
# identity through `x-suspect-sdk-defaults`, so the harness also proves
# the emission disappears without that configuration.
x-suspect-feature: env-var-credentials
x-suspect-gated: true
x-suspect-sdk-defaults: {env_prefix: FRAGMENT}
openapi: 3.1.0
info: {title: behavioral fragments, version: '1'}
servers:
  - url: https://api.env.test/v1
security:
  - apiKey: []
paths:
  /secrets:
    get:
      operationId: listSecrets
      responses:
        '200':
          description: Every secret name.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
x-suspect-behavior:
  python:
    file: python/src/pagination_sdk/_credential_env.py
    markers:
      - 'FRAGMENT_API_KEY'
  rust:
    file: rust/src/credential_env.rs
    markers:
      - 'FRAGMENT_API_KEY'
  go:
    file: go/http_environment.go
    markers:
      - 'FRAGMENT_API_KEY'
      - 'NewClientFromEnv'
  swift:
    file: swift/Sources/PaginationSDK/Client.swift
    markers:
      - 'FRAGMENT_API_KEY'
      - 'fromEnvironment'
  java:
    file: java/src/main/java/test/suspect/Client.java
    markers:
      - 'FRAGMENT_API_KEY'
      - 'public static Client fromEnv()'
  kotlin:
    file: kotlin/src/main/kotlin/test/suspect/pagination_kotlin/CredentialEnvironment.kt
    markers:
      - 'FRAGMENT_API_KEY'
      - 'EnvironmentCredentials'
  ruby:
    file: ruby/lib/pagination_sdk/credential_env.rb
    markers:
      - 'FRAGMENT_API_KEY'
  php:
    file: php/src/Client.php
    markers:
      - 'FRAGMENT_API_KEY'
      - 'public static function fromEnv('
  dart:
    file: dart/lib/src/environment.dart
    markers:
      - 'FRAGMENT_API_KEY'
      - '_credentialsFromEnvironment'
  cpp:
    file: cpp/src/client.cpp
    markers:
      - 'FRAGMENT_API_KEY'
      - 'credential_env_snapshot'
