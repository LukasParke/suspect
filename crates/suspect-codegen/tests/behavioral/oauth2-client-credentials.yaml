# INVARIANT: OAuth 2.0 client-credentials auth compiles into a typed token
# runtime in every backend that claims `oauth2-client-credentials` — the
# token endpoint, the client-credentials grant, token caching, and
# revocation/introspection — derived from the declared security scheme
# rather than hard-coded. Each backend exposes its token type plus the
# client-credentials acquisition entry point.
# INVARIANT: the token runtime is core emission for an admitted OAuth
# scheme, not SDK-defaults-gated; the fragment declares
# `x-suspect-gated: false`.
x-suspect-feature: oauth2-client-credentials
x-suspect-gated: false
openapi: 3.1.0
info: {title: behavioral fragments, version: '1'}
servers:
  - url: https://api.oauth.test/v1
security:
  - clientCredentials: []
paths:
  /reports:
    get:
      operationId: listReports
      responses:
        '200':
          description: Every report.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.oauth.test/oauth/token
          refreshUrl: https://auth.oauth.test/oauth/token
          scopes:
            reports:read: Read reports.
x-suspect-behavior:
  typescript:
    file: typescript/oauth.ts
    markers:
      - 'export interface TokenSet'
      - 'function refreshToken'
  python:
    file: python/src/pagination_sdk/_oauth.py
    markers:
      - 'class TokenSet'
      - 'def refresh_token_set'
  rust:
    file: rust/src/oauth.rs
    markers:
      - 'pub struct TokenSet'
      - 'async fn client_credentials_token'
  go:
    file: go/oauth.go
    markers:
      - 'type TokenSet'
      - 'func WithTokenClientCredentials'
  swift:
    file: swift/Sources/PaginationSDK/OAuth.swift
    markers:
      - 'struct TokenSet'
      - 'func clientCredentialsToken'
  java:
    file: java/src/main/java/test/suspect/OAuth.java
    markers:
      - 'public static final class TokenSet'
  kotlin:
    file: kotlin/src/main/kotlin/test/suspect/pagination_kotlin/OAuth.kt
    markers:
      - 'class TokenSet'
      - 'clientCredentialsToken('
  csharp:
    file: csharp/src/OAuth.g.cs
    markers:
      - 'public sealed class MemoryTokenStore'
  ruby:
    file: ruby/lib/pagination_sdk/oauth.rb
    markers:
      - 'TokenSet'
      - 'def client_credentials_token'
  php:
    file: php/src/OAuth.php
    markers:
      - 'class TokenSet'
      - 'function tokenSetFrom'
  dart:
    file: dart/lib/src/oauth.dart
    markers:
      - 'class TokenSet'
      - 'clientCredentialsToken('
  cpp:
    file: cpp/include/pagination_cpp/oauth.hpp
    markers:
      - 'class OAuthTokenStore'
      - 'client_credentials_token'
