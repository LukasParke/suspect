Node:
  type: object
  required: [label]
  properties:
    label:
      type: string
      minLength: 1
    child:
      $ref: '#/Node'
Request:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/Node'
      examples:
        seed:
          value:
            label: seed
Reply:
  description: Created tree
  content:
    application/json:
      schema:
        $ref: '#/Node'
      example:
        label: parent
        child:
          label: leaf
