[package]
name = "suspect-lsp"
description = "Language server for OpenAPI, Arazzo, and Overlay documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
suspect-low.workspace = true
suspect-ref.workspace = true
suspect-oas.workspace = true
suspect-validate.workspace = true
suspect-lint.workspace = true
suspect-source.workspace = true
suspect-syntax.workspace = true
suspect-arazzo.workspace = true
suspect-overlay.workspace = true
tower-lsp.workspace = true
tokio = { workspace = true, features = ["io-std"] }
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
suspect-test.workspace = true
suspect-gen.workspace = true
suspect-ir.workspace = true
suspect-journal.workspace = true
suspect-rex.workspace = true
bytes.workspace = true
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls",
] }
async-trait = { workspace = true, optional = true }

[features]
default = ["live-run"]
live-run = ["dep:reqwest", "dep:async-trait"]

[dev-dependencies]
suspect-arazzo.workspace = true
suspect-lint.workspace = true
suspect-validate.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
criterion.workspace = true

[[bench]]
name = "lsp"
harness = false

[[example]]
name = "showcase"
