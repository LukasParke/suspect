# Arazzo 1.0 with deliberate problems, for the registry corpus.
arazzo: 1.0.1
info:
  version: "1"
sourceDescriptions:
  - name: api
    url: ./api.yaml
    type: openapi
  - name: api
    url: ./other.yaml
    type: openapi
workflows:
  - workflowId: flow
    steps:
      - stepId: one
        successCriteria:
          - context: $statusCode
        onSuccess:
          - name: next
            type: goto
          - name: jump
            type: goto
            workflowId: nowhere
          - name: odd
            type: teleport
      - stepId: one
        operationId: listPets
        operationPath: "{$sourceDescriptions.api.url}#/paths"
        parameters:
          - name: limit
    outputs:
      total: $workflows.flow.steps.missing.outputs.total
  - steps: []
