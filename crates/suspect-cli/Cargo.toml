[package]
name = "suspect-cli"
description = "suspect: OpenAPI/Arazzo/Overlay toolkit CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "suspect"
path = "src/main.rs"

[dependencies]
suspect-test.workspace = true
suspect-gen.workspace = true
suspect-ir.workspace = true
suspect-journal.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
axum = { version = "0.8", optional = true }
async-trait.workspace = true
bytes.workspace = true

suspect-source.workspace = true
suspect-syntax.workspace = true
suspect-low.workspace = true
suspect-ref.workspace = true
suspect-jsonpath.workspace = true
suspect-schema.workspace = true
suspect-oas.workspace = true
suspect-overlay.workspace = true
suspect-arazzo.workspace = true
suspect-validate.workspace = true
suspect-lint.workspace = true
suspect-lsp.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
serde.workspace = true
rayon.workspace = true
anyhow.workspace = true
suspect-watch.workspace = true
suspect-gateway.workspace = true
suspect-codegen.workspace = true

[features]
default = ["live-http"]
live-http = ["dep:reqwest", "dep:axum"]

[dev-dependencies]
tempfile.workspace = true
