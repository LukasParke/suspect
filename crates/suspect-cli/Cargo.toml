[package]
name = "suspect-cli"
description = "suspect: OpenAPI/Arazzo/Overlay toolkit CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "suspect"
path = "src/main.rs"

[dependencies]
suspect-test.workspace = true
suspect-gen.workspace = true
suspect-ir.workspace = true
suspect-journal.workspace = true
suspect-codegen.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "cookies"], optional = true }
axum = { version = "0.8", optional = true }
async-trait.workspace = true
bytes.workspace = true

suspect-source.workspace = true
suspect-syntax.workspace = true
suspect-low.workspace = true
suspect-config.workspace = true
suspect-check.workspace = true
suspect-diag.workspace = true
suspect-ref.workspace = true
suspect-jsonpath.workspace = true
suspect-schema.workspace = true
suspect-oas.workspace = true
suspect-overlay.workspace = true
suspect-arazzo.workspace = true
suspect-validate.workspace = true
suspect-lint.workspace = true
suspect-rules.workspace = true
suspect-lsp.workspace = true
tower-lsp = "0.20"
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
serde.workspace = true
libc.workspace = true
sha2.workspace = true
rayon.workspace = true
anyhow.workspace = true
notify.workspace = true
regex.workspace = true
suspect-gateway.workspace = true

[features]
default = ["live-http"]
live-http = ["dep:reqwest", "dep:axum"]


[dev-dependencies]
tempfile.workspace = true

# Released by cargo-dist (dist-workspace.toml) although it is not on crates.io.
[package.metadata.dist]
dist = true
